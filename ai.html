<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Тарих тірілді — ИИ-гид по Казахстану</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg:#f1f5f9; --panel:#ffffff; --border:#cbd5e1; --text:#0f172a; --muted:#64748b; --acc:#0284c7; --userbg:#0284c7; --usertx:#fff; --botbg:#e2e8f0;
    --scrollbar-thumb:#cbd5e1; --scrollbar-track:transparent;
    --correct-bg:#dcfce7; --correct-border:#22c55e; --correct-text:#15803d;
    --wrong-bg:#fee2e2; --wrong-border:#ef4444; --wrong-text:#b91c1c;
    --info-bg:#e0f2fe; --info-bd:#38bdf8; --warn-bg:#fef3c7; --warn-bd:#f59e0b; --err-bg:#fee2e2; --err-bd:#ef4444;
  }
  :root[data-theme="dark"] {
    --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --acc:#38bdf8; --userbg:#0ea5e9; --usertx:#fff; --botbg:#1e293b;
    --scrollbar-thumb:#334155; --scrollbar-track:transparent;
    --correct-bg:#14532d; --correct-border:#22c55e; --correct-text:#86efac;
    --wrong-bg:#7f1d1d; --wrong-border:#ef4444; --wrong-text:#fca5a5;
    --info-bg:#0c4a6e; --info-bd:#0284c7; --warn-bg:#78350f; --warn-bd:#f59e0b; --err-bg:#7f1d1d; --err-bd:#ef4444;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; transition:background .2s,color .2s; overflow:hidden; }
  .app { width:100%; max-width:820px; height:100vh; height:100dvh; display:flex; flex-direction:column; padding:16px; padding-bottom:max(16px, env(safe-area-inset-bottom)); gap:10px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.25rem; }
  header h1 span { color:var(--acc); }
  .controls-top { display:flex; gap:8px; align-items:center; margin-left:auto; }
  button, select { font-family:inherit; }
  .btn, .lang button { background:var(--panel); color:var(--text); border:1px solid var(--border); padding:6px 10px; border-radius:8px; cursor:pointer; font-size:.85rem; }
  .btn:hover, .lang button:hover { border-color:var(--acc); }
  .icon-btn { background:none; border:none; padding:4px 8px; font-size:1.1rem; cursor:pointer; line-height:1; color:var(--text); border-radius:6px; }
  .icon-btn:hover { color:var(--acc); background:var(--botbg); }
  .icon-btn.small-text { font-size:.75rem; }
  .lang { display:flex; gap:4px; }
  .lang button.active { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:600; }
  .controls-sub { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px; font-size:.85rem; max-width:320px; flex:1; min-width:0; }

  .notice { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; border:1px solid; font-size:.85rem; line-height:1.45; }
  .notice.hidden { display:none; }
  .notice.info { background:var(--info-bg); border-color:var(--info-bd); }
  .notice.warn { background:var(--warn-bg); border-color:var(--warn-bd); }
  .notice.error { background:var(--err-bg); border-color:var(--err-bd); }
  .notice .nbody { flex:1; min-width:0; }
  .notice .nactions { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .notice .nactions button { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:5px 10px; font-size:.8rem; cursor:pointer; }
  .notice .nactions button:hover { border-color:var(--acc); }
  .notice .nx { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; padding:0 4px; }

  #status { font-size:.8rem; color:var(--muted); }
  .bar { height:4px; background:var(--border); border-radius:4px; overflow:hidden; }
  .bar div { height:100%; width:0%; background:var(--acc); transition:width .3s; }
  #chat { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:10px; padding:4px; scrollbar-width:thin; scrollbar-color:var(--scrollbar-thumb) var(--scrollbar-track); }
  #chat::-webkit-scrollbar { width:6px; }
  #chat::-webkit-scrollbar-track { background:var(--scrollbar-track); }
  #chat::-webkit-scrollbar-thumb { background-color:var(--scrollbar-thumb); border-radius:4px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; line-height:1.5; font-size:1rem; word-break:break-word; overflow-wrap:break-word; }
  .msg .t { white-space:pre-wrap; word-break:break-word; overflow-wrap:break-word; }
  .bot { background:var(--botbg); border:1px solid var(--border); align-self:flex-start; border-bottom-left-radius:4px; }
  .user { background:var(--userbg); color:var(--usertx); align-self:flex-end; border-bottom-right-radius:4px; }
  .src { margin-top:6px; font-size:.75rem; color:var(--muted); }
  .msg-map-box { margin-top:10px; height:180px; width:100%; border-radius:10px; border:1px solid var(--border); overflow:hidden; }
  .quiz-box { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .quiz-option { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:8px; cursor:pointer; font-size:.9rem; text-align:left; transition:all .2s; }
  .quiz-option:hover:not(:disabled) { border-color:var(--acc); background:var(--bg); }
  .quiz-option:disabled { cursor:default; }
  .quiz-option.correct { background:var(--correct-bg)!important; border-color:var(--correct-border)!important; color:var(--correct-text)!important; font-weight:bold; }
  .quiz-option.wrong { background:var(--wrong-bg)!important; border-color:var(--wrong-border)!important; color:var(--wrong-text)!important; }
  .hints-container { display:flex; flex-direction:column; gap:6px; }
  .hints-header { display:flex; justify-content:flex-end; }
  .btn-arrow { background:transparent; border:none; color:var(--muted); font-size:.85rem; cursor:pointer; padding:2px 6px; }
  .btn-arrow:hover { color:var(--acc); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips.hidden { display:none; }
  .chip { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:999px; cursor:pointer; font-size:.85rem; }
  .chip:hover { border-color:var(--acc); }
  .input { display:flex; gap:8px; }
  .input input { flex:1; min-width:0; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:16px; outline:none; }
  .input input:focus { border-color:var(--acc); }
  .input button { background:var(--acc); color:#fff; border:none; border-radius:12px; padding:0 22px; font-size:1rem; cursor:pointer; }
  .input button:disabled, .input input:disabled { opacity:.5; cursor:not-allowed; }
  footer { font-size:.72rem; color:var(--muted); text-align:center; }
  @media (max-width:600px) {
    .app { padding:10px; padding-bottom:max(10px, env(safe-area-inset-bottom)); gap:8px; }
    header h1 { font-size:1.05rem; }
    .msg { max-width:94%; padding:9px 12px; }
    select { max-width:none; }
    .msg-map-box { height:160px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🇰🇿 <span>Тарих тірілді</span> · AI</h1>
    <div class="controls-top">
      <div class="lang">
        <button id="b-kz" onclick="setLang('kz')">KZ</button>
        <button id="b-ru" class="active" onclick="setLang('ru')">RU</button>
        <button id="b-en" onclick="setLang('en')">EN</button>
      </div>
      <button class="icon-btn" id="b-reload-ai" onclick="reloadAI()" title="Перезагрузить ИИ">↻</button>
      <button class="icon-btn" id="b-theme" onclick="toggleTheme()" title="Сменить тему">🌙</button>
    </div>

  <div class="controls-sub">
    <select id="model">
      <option value="cloud"> ☁ Облачный ИИ - (телефон, слабые ПК)</option>
      <option value="Qwen2.5-3B-Instruct-q4f16_1-MLC"> Qwen 2.5 · 3B — на устройстве, ~2 ГБ</option>

    </select>
    <button class="icon-btn small-text" id="b-clear-chat" onclick="clearChat()" title="Очистить чат">↩ Очистить чат</button>
  </div>

  <div class="notice hidden" id="notice">
    <div class="nbody"><div id="notice-text"></div><div class="nactions" id="notice-actions"></div></div>
    <button class="nx" onclick="hideNotice()" title="OK">✕</button>
  </div>

  <div id="status">…</div>
  <div class="bar"><div id="bar"></div></div>

  <div id="chat"></div>

  <div class="hints-container">
    <div class="hints-header">
      <button class="btn-arrow" id="b-hints" onclick="toggleHints()" title="Подсказки">▼</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="input">
    <input id="q" type="text" maxlength="500" autocomplete="off" disabled />
    <button id="send" disabled onclick="ask()">➤</button>
  </div>
  <footer id="foot"></footer>
</div>

   Публичный endpoint без ключа (Pollinations). Он сторонний: лимиты/условия могут измениться.
   Для надёжности замените CLOUD_URL на свой прокси (формат OpenAI chat/completions). */
const CLOUD_URL = "https://text.pollinations.ai/openai";
const CLOUD_MODEL = "openai";
const CLOUD_TIMEOUT = 25000;             // мс на один запрос

const MODEL_META = {

};
const LOCAL_DEFAULT = "Qwen2.5-3B-Instruct-q4f16_1-MLC";

/* ================= ОПРЕДЕЛЕНИЕ УСТРОЙСТВА ================= */
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Mac/i.test(navigator.platform));
const lowMem = !!(navigator.deviceMemory && navigator.deviceMemory <= 4);

async function probeGPU(){
  try{
    if(!navigator.gpu) return { ok:false, why:'nogpu' };
    const a = await navigator.gpu.requestAdapter();
    if(!a) return { ok:false, why:'noadapter' };
    return { ok:true };
  }catch(e){ return { ok:false, why:'error' }; }
}
function weakReasons(){
  const r=[];
  if(isMobile) r.push('mobile');
  if(!gpuInfo.ok) r.push('gpu');
  if(lowMem) r.push('mem');
  return r;
}

/* ================= КАРТА В СООБЩЕНИИ ================= */
function renderMapInMessage(msgElem, lat, lng, title) {
  if (typeof L === 'undefined') return;
  mapCounter++;
  const mapId = `msg-map-${mapCounter}`;
  const mapBox = document.createElement('div');
  mapBox.className = 'msg-map-box';
  mapBox.id = mapId;
  msgElem.appendChild(mapBox);
  setTimeout(() => {
    try {
      const map = L.map(mapId, {scrollWheelZoom:false}).setView([lat, lng], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'© OpenStreetMap' }).addTo(map);
      L.marker([lat, lng]).addTo(map).bindPopup(`<b>${title}</b>`).openPopup();
      map.invalidateSize();
    } catch(e) { console.warn(e); }
  }, 150);
}

function retrieve(q){
  const ql=q.toLowerCase(), out=[];
  KB.map(e=>({e,s:e.k.reduce((a,kw)=>a+(ql.includes(kw)?kw.length:0),0)})).filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s).slice(0,3).forEach(x=>out.push({t:x.e.t, src:KB_SOURCE, loc:x.e.loc, name:x.e.name}));
  return out;
}

function showNotice(level, text, actions=[], kind=''){
  noticeKind = kind;
  const n=$('notice'); n.className='notice '+level;
  $('notice-text').textContent=text;
  const box=$('notice-actions'); box.innerHTML='';
  actions.forEach(a=>{ const b=document.createElement('button'); b.textContent=a.label; b.onclick=a.fn; box.appendChild(b); });
}
window.hideNotice = ()=>{ $('notice').className='notice hidden'; noticeKind=''; };
const cloudBtn = ()=>({label:T[lang].btnCloud, fn:()=>switchModel('cloud')});
const localBtn = ()=>({label:T[lang].btnLocal, fn:()=>switchModel(LOCAL_DEFAULT)});
const retryBtn = ()=>({label:T[lang].btnRetry, fn:()=>reloadAI()});
function switchModel(v){ $('model').value=v; store.set('model',v); init(); }
function reasonText(code){ return T[lang].reasons[code] || T[lang].reasons.http; }

function deviceNotice(){
  const why = weakReasons().map(c=>T[lang].why[c]).join(', ');
  const weak = weakReasons().length>0;
  const choice = $('model').value;
  if(choice==='cloud'){
    if(weak) showNotice('info', T[lang].weakCloudOn(why), [], 'device');
    else if(gpuInfo.ok) showNotice('info', T[lang].strongCloudOn, [localBtn()], 'device');
    else hideNotice();
  } else if(weak){
    showNotice('warn', T[lang].weakLocalOn(why), [cloudBtn()], 'device');
  } else if(/7B/.test(choice) && (isMobile || (navigator.deviceMemory && navigator.deviceMemory<8))){
    showNotice('warn', T[lang].heavy7b, [cloudBtn()], 'device');
  } else hideNotice();
}
function cloudFailNotice(code){
  const acts=[retryBtn()];
  if(gpuInfo.ok) acts.push(localBtn());
  showNotice('error', T[lang].cloudDown(reasonText(code)), acts, 'cloud');
}

}
async function cloudChat(messages, o={}){
  const timeout=o.timeout||CLOUD_TIMEOUT, max=o.single?1:2;
  let last=null;
  for(let i=0;i<max;i++){
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),timeout);
    try{
      const r=await fetch(CLOUD_URL,{ method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:CLOUD_MODEL, messages}), signal:ctrl.signal });
      clearTimeout(to);
      if(r.status===429){ last=cerr('rate'); if(i<max-1){ await sleep(6000); continue; } throw last; }
      if(!r.ok){ last=cerr('http'); if(i<max-1){ await sleep(2000); continue; } throw last; }
      const j=await r.json();
      const txt=cleanCloud(j.choices?.[0]?.message?.content);
      if(!txt) throw cerr('empty');
      return txt;
    }catch(e){
      clearTimeout(to);
      if(e.code) throw e;
      throw cerr(e.name==='AbortError' ? 'timeout' : (e instanceof TypeError ? 'network' : 'http'));
    }
  }
  throw last || cerr('network');
}
async function pingCloud(my){
  $('status').textContent=T[lang].cloudChecking;
  const t0=Date.now();
  try{
    await cloudChat([{role:'user',content:'ok?'}],{single:true,timeout:15000});
    if(my!==initId||mode!=='cloud') return;
    $('status').textContent=T[lang].cloudOk(Math.round((Date.now()-t0)/1000));
  }catch(e){
    if(my!==initId||mode!=='cloud') return;
    if(e.code==='rate'){ updateReadyStatus(); return; }      // 429 = сервер доступен, просто занят
    $('status').textContent=T[lang].cloudBad;
    cloudFailNotice(e.code);
  }
}

/* ================= ЕДИНЫЙ ВЫЗОВ МОДЕЛИ ================= */
async function llm(messages, temp, out, maxTokens=420, tickerEl=null){
  if(mode==='cloud'){
    const el = out || tickerEl;
    let sec=0;
    const iv=setInterval(()=>{ sec++; if(el) setText(el, `${UI[lang].think} ${sec} ${UI[lang].sec}`+(sec>=15?`\n${T[lang].cloudSlow}`:'')); },1000);
    try{
      const txt = await cloudChat(messages);
      if(out) setText(out, txt);
      return txt;
    } finally { clearInterval(iv); }
  }
  if(!engine) throw cerr('noengine');
  const wd=setTimeout(()=>{ try{ engine.interruptGenerate(); }catch(e){} }, 120000);   // страховка от зависания
  try{
    if(out){
      const stream = await engine.chat.completions.create({ messages, temperature:temp, top_p:0.85, max_tokens:maxTokens, stream:true });
      let acc='';
      for await (const ch of stream){ acc += ch.choices[0]?.delta?.content || ''; setText(out, acc); }
      return acc.trim();
    }
    const r = await engine.chat.completions.create({ messages, temperature:temp, max_tokens:maxTokens });
    return (r.choices[0]?.message?.content||'').trim();
  } finally { clearTimeout(wd); }
}

/* ================= ЗАПУСК ================= */
function finishReady(){
  ready=true; busy=false; $('bar').style.width='100%';
  $('q').disabled=$('send').disabled=false;
  updateReadyStatus(); updateFoot();
  if(!isMobile) $('q').focus();
}
function fmtEta(s){ return s>=90 ? `~${Math.round(s/60)} ${UI[lang].min}` : `~${Math.max(5,Math.round(s/5)*5)} ${UI[lang].sec}`; }
function failLocal(kind, err){
  ready=false; $('q').disabled=$('send').disabled=true;
  $('status').textContent=UI[lang].failedStatus; $('bar').style.width='0%';
  if(kind==='nogpu') showNotice('warn', T[lang].noGPU(isMobile), [cloudBtn(), retryBtn()], 'fail');
  else showNotice('error', T[lang].localFail(String(err?.message||err).slice(0,90)), [cloudBtn(), retryBtn()], 'fail');
}

async function init(){
  const my=++initId;
  hideNotice();
  ready=false; busy=false; $('q').disabled=$('send').disabled=true; $('bar').style.width='0%';
  if(engine){ const old=engine; engine=null; try{ await old.unload(); }catch(e){} }
  if(my!==initId) return;
  const choice=$('model').value;

  if(choice==='cloud'){
    mode='cloud';
    finishReady(); deviceNotice(); pingCloud(my);
    return;
  }

  mode='local';
  if(!gpuInfo.ok){ failLocal('nogpu'); return; }

  const meta=MODEL_META[choice]||MODEL_META[LOCAL_DEFAULT];
  showNotice('info', T[lang].loadingLocal(meta.gb, meta.first, meta.cached), [cloudBtn()], 'loading');
  const t0=Date.now(); let lastP=0, lastChange=Date.now(), stuckShown=false;
  const watch=setInterval(()=>{
    if(!stuckShown && Date.now()-lastChange>90000){ stuckShown=true; showNotice('warn', T[lang].stuck, [cloudBtn(), retryBtn()], 'fail'); }
  },5000);
  try{
    if(!webllm) webllm = await import("https://esm.run/@mlc-ai/web-llm");
    const e = await webllm.CreateMLCEngine(choice,{
      initProgressCallback:p=>{
        if(my!==initId) return;
        const pr=p.progress||0;
        if(pr>lastP){ lastP=pr; lastChange=Date.now(); }
        const el=(Date.now()-t0)/1000;
        const eta = pr>0.03 ? ` · ${fmtEta(el*(1-pr)/pr)} ${UI[lang].left}` : '';
        $('status').textContent=`${UI[lang].load}: ${Math.round(pr*100)}%${eta}`;
        $('bar').style.width=(pr*100)+'%';
      }
    });
    clearInterval(watch);
    if(my!==initId){ try{ await e.unload(); }catch(x){} return; }
    engine=e; finishReady(); deviceNotice();
  }catch(err){
    clearInterval(watch);
    console.error(err);
    if(my!==initId) return;
    failLocal('error', err);
  }
}
window.reloadAI = () => { init(); };
$('model').onchange=()=>{ store.set('model',$('model').value); init(); };

/* ================= ВИКТОРИНА ================= */
async function startQuiz() {
  if (!ready || busy) return;
  add(UI[lang].quizTag, 'user');
  const out = add(UI[lang].think, 'bot');
  busy = true;

  let topicFact = "";
  if (chatHistory.length > 0) topicFact = chatHistory.slice(-4).map(h => h.text).join(" ");
  else topicFact = KB[Math.floor(Math.random() * KB.length)].t;

  const quizPrompt = `Составь 1 короткий вопрос викторины по истории Казахстана на основе этого факта: "${topicFact}".
${REM[lang]}
ОБЯЗАТЕЛЬНЫЙ ФОРМАТ ОТВЕТА (ничего лишнего не пиши):
Вопрос: [Текст вопроса]
A) [Вариант 1]
B) [Вариант 2]
C) [Вариант 3]
Правильный ответ: [Буква A, B или C]`;

  try {
    const rawText = await llm([
      { role:"system", content: SYS[lang]("Используй только указанные инструкции для создания вопроса викторины.") },
      { role:"user", content: quizPrompt }
    ], 0.3, null, 300, out);
    parseAndRenderQuiz(out, rawText);
  } catch (e) {
    console.error(e);
    setText(out, UI[lang].quizFail);
    if(mode==='cloud') cloudFailNotice(e.code);
  }
  busy = false;
}

const norm = ch => ch.toUpperCase().replace('А','A').replace('В','B').replace('С','C');
function parseAndRenderQuiz(msgElem, rawText) {
  const matchCorrect = rawText.match(/(?:Правильный ответ|Correct answer|Дұрыс жауап)\s*:?\s*\**\s*([A-CА-СВ])/i);
  const correctChar = matchCorrect ? norm(matchCorrect[1]) : 'A';
  const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  let question = "";
  const options = [];
  lines.forEach(line => {
    if (/^(вопрос|question|сұрақ)\s*:/i.test(line)) question = line.replace(/^[^:]+:/, '').trim();
    else if (/^[A-CА-СВ][\)\.]/i.test(line)) options.push(line);
  });
  if (!question && lines.length > 0) question = lines[0];
  setText(msgElem, question || rawText);

  if (options.length > 0) {
    const quizBox = document.createElement('div');
    quizBox.className = 'quiz-box';
    options.forEach(optText => {
      const optBtn = document.createElement('button');
      optBtn.className = 'quiz-option';
      optBtn.textContent = optText;
      const firstChar = norm(optText.charAt(0));
      optBtn.onclick = () => {
        const allBtns = quizBox.querySelectorAll('.quiz-option');
        allBtns.forEach(b => b.disabled = true);
        if (firstChar === correctChar) optBtn.classList.add('correct');
        else {
          optBtn.classList.add('wrong');
          allBtns.forEach(b => { if (norm(b.textContent.charAt(0)) === correctChar) b.classList.add('correct'); });
        }
      };
      quizBox.appendChild(optBtn);
    });
    msgElem.appendChild(quizBox);
  }
}

/* ================= ВОПРОС-ОТВЕТ ================= */
window.ask = async () => {
  const text=$('q').value.trim();
  if(!text||!ready||busy) return;
  if (text.toLowerCase() === 'викторина' || text.toLowerCase() === 'quiz') { $('q').value=''; startQuiz(); return; }

  busy=true; $('q').value=''; add(text,'user');
  chatHistory.push({role:'user', text});

  const out=add(UI[lang].think,'bot');
  const L = detect(text);
  const facts = retrieve(text);
  const ctx = facts.length ? HEAD[L]+"\n- "+facts.map(f=>f.t).join("\n- ") : NOFACTS[L];
  const user = `${text}\n\n${REM[L]}`;

  try{
    let acc='', ok=false, failed=false, errCode='';
    const attempts = mode==='cloud' ? 2 : 3;      // в облаке не тратим лимит запросов лишний раз
    try{
      for(let attempt=0; attempt<attempts && !ok; attempt++){
        const extra = attempt ? "\n\nВАЖНО / IMPORTANT: "+REM[L] : "";
        acc = await llm([{role:"system",content:SYS[L](ctx)+extra},{role:"user",content:user}], attempt?0.1:0.25, out);
        ok = acc && langOK(acc,L);
        if(!ok && attempt<attempts-1) setText(out, UI[lang].retry);
      }
      if(!ok) acc = acc.replace(CJK,'').trim();
    }catch(e){
      console.error(e); failed=true; errCode=e.code||'';
      if(mode==='cloud') cloudFailNotice(errCode);
    }

    if(failed || !acc){
      acc = facts.length ? UI[lang].noai+"\n\n"+facts.map(f=>"• "+f.t).join("\n") : UI[lang].noaiNone;
    }
    setText(out, acc);
    chatHistory.push({role:'bot', text:acc});

    const locFact = facts.find(f => f.loc);
    if (locFact) renderMapInMessage(out, locFact.loc[0], locFact.loc[1], locFact.name);

    if(facts.length){
      const s=document.createElement('div'); s.className='src';
      s.textContent = "📚 "+UI[lang].src+": "+[...new Set(facts.map(f=>f.src))].join(", ");
      out.appendChild(s);
    }
  }catch(e){ console.error(e); setText(out,"Error / Қате / Ошибка"); }
  busy=false;
};
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') ask(); });
